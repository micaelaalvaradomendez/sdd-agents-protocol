name: Lint Skills & Constitution

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make sdd executable
        run: chmod +x scripts/sdd sdd 2>/dev/null || chmod +x scripts/sdd

      - name: Run SDD validation and drift check
        run: ./sdd check
